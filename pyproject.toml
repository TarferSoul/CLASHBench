[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clashbench"
version = "0.1.0"
description = "Docker-only evaluation tools for CLASHBench"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
clashbench = "clashbench.cli:main"

[tool.setuptools]
packages = ["clashbench"]

[tool.setuptools.package-data]
clashbench = ["prompts/*.txt"]
