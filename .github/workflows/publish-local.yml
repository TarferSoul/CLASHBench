name: Publish validated local runtime
on:
  workflow_dispatch:
    inputs:
      runner_label:
        description: Label of the one-job maintainer runner
        required: true
      image_id:
        description: Exact sha256 image ID that passed local validation
        required: true
      variant:
        type: choice
        options: [both, cpu, gpu]
        required: true
      gpu_image_id:
        description: Exact GPU image ID when publishing both variants
        required: false
permissions:
  contents: read
  packages: write
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, '${{ inputs.runner_label }}']
    timeout-minutes: 180
    env:
      SOURCE_IMAGE: '${{ inputs.image_id }}'
      VARIANT: '${{ inputs.variant }}'
      GPU_SOURCE_IMAGE: '${{ inputs.gpu_image_id }}'
    steps:
      - name: Isolate registry credentials
        run: echo "DOCKER_CONFIG=$RUNNER_TEMP/clash-docker-auth" >> "$GITHUB_ENV"
      - name: Use HTTP/1.1 for repository transfer
        run: git config --global http.version HTTP/1.1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Validate exact image
        run: |
          manifest="$RUNNER_TEMP/clash-images.tsv"
          if [ "$VARIANT" = both ]; then
            printf 'cpu\t%s\ngpu\t%s\n' "$SOURCE_IMAGE" "$GPU_SOURCE_IMAGE" > "$manifest"
          else
            printf '%s\t%s\n' "$VARIANT" "$SOURCE_IMAGE" > "$manifest"
          fi
          while read -r variant source; do
            test "$(docker image inspect --format '{{.Id}}' "$source")" = "$source"
            container=$(docker create "$source")
            trap 'docker rm -f "$container" >/dev/null' EXIT
            docker cp "$container:/opt/acb/acb" "$RUNNER_TEMP/$variant-acb"
            diff -r --exclude=__pycache__ acb "$RUNNER_TEMP/$variant-acb"
            if [ "$variant" = gpu ]; then
              docker cp "$container:/opt/acb/check_gpu_runtime.py" "$RUNNER_TEMP/check_gpu_runtime.py"
              cmp docker/check_gpu_runtime.py "$RUNNER_TEMP/check_gpu_runtime.py"
            fi
            docker rm "$container"
            trap - EXIT
            for cli in codex claude opencode; do
              docker run --rm --network none --entrypoint "/opt/harness/$cli/node_modules/.bin/$cli" "$source" --version
            done
            python3 tests/docker_smoke.py --image "$source"
            if [ "$variant" = gpu ]; then
              docker run --rm --network none --entrypoint /opt/conda/bin/python "$source" /opt/acb/check_gpu_runtime.py
            fi
          done < "$manifest"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: '${{ github.actor }}'
          password: '${{ secrets.GITHUB_TOKEN }}'
      - name: Publish
        env:
          REVISION: '${{ github.sha }}'
        run: |
          while read -r variant source; do
            target="ghcr.io/tarfersoul/clashbench:$variant"
            docker tag "$source" "$target-$REVISION"
            docker tag "$source" "$target"
            docker push "$target-$REVISION"
            docker push "$target"
            docker pull "$target"
            echo "Published $target from $source" >> "$GITHUB_STEP_SUMMARY"
          done < "$RUNNER_TEMP/clash-images.tsv"
