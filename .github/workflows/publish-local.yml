name: Publish validated local runtime
on:
  workflow_dispatch:
    inputs:
      runner_label:
        description: Label of the one-job maintainer runner
        required: true
      image_id:
        description: Exact sha256 image ID that passed local validation
        required: true
      variant:
        type: choice
        options: [cpu, gpu]
        required: true
permissions:
  contents: read
  packages: write
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, '${{ inputs.runner_label }}']
    timeout-minutes: 90
    env:
      SOURCE_IMAGE: '${{ inputs.image_id }}'
      VARIANT: '${{ inputs.variant }}'
      DOCKER_CONFIG: '${{ runner.temp }}/clash-docker-auth'
    steps:
      - uses: actions/checkout@v4
      - name: Validate exact image
        run: |
          test "$(docker image inspect --format '{{.Id}}' "$SOURCE_IMAGE")" = "$SOURCE_IMAGE"
          for cli in codex claude opencode; do
            docker run --rm --network none --entrypoint "/opt/harness/$cli/node_modules/.bin/$cli" "$SOURCE_IMAGE" --version
          done
          python3 tests/docker_smoke.py --image "$SOURCE_IMAGE"
          if [ "$VARIANT" = gpu ]; then
            docker run --rm --network none --entrypoint /opt/conda/bin/python "$SOURCE_IMAGE" /opt/acb/check_gpu_runtime.py
          fi
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: '${{ github.actor }}'
          password: '${{ secrets.GITHUB_TOKEN }}'
      - name: Publish
        env:
          REVISION: '${{ github.sha }}'
        run: |
          target="ghcr.io/tarfersoul/clashbench:$VARIANT"
          docker tag "$SOURCE_IMAGE" "$target-$REVISION"
          docker tag "$SOURCE_IMAGE" "$target"
          docker push "$target-$REVISION"
          docker push "$target"
          echo "Published $target from $SOURCE_IMAGE" >> "$GITHUB_STEP_SUMMARY"
