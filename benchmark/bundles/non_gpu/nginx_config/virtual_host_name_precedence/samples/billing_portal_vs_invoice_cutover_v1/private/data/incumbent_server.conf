server {
    listen 127.0.0.1:18480;
    server_name billing.internal;
    location = /app {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_pass http://127.0.0.1:19481/portal;
    }
    location = /gateway-health { access_log off; return 200 "billing-gateway-ready\n"; }
}
